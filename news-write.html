<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
  <title>게시글 작성 | 서면포스코부동산</title>
  <style>
    @layer base {
      html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        font-family: "Toss Product Sans", "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        font-size: 14px;
      }
      body {
        overscroll-behavior: none;
        background-color: #f8f9ff;
        color: #191f28;
      }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    }
    ::-webkit-scrollbar { display: none; }
    img { max-width: 100%; object-fit: cover; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container": "#e9eefb",
            "on-surface-variant": "#414754",
            "inverse-on-surface": "#ebf1fe",
            "muted": "#8b95a1",
            "secondary": "#0056c6",
            "surface": "#f2f4f6",
            "surface-container-lowest": "#ffffff",
            "weak-background": "#e8f3ff",
            "on-secondary": "#ffffff",
            "danger": "#e42939",
            "inverse-surface": "#2b313a",
            "body": "#4e5968",
            "border": "#e5e8eb",
            "on-primary": "#ffffff",
            "on-surface": "#161c25",
            "primary": "#0059b9",
            "surface-container-low": "#eff4ff"
          },
          fontSize: {
            "headline-sm": ["1.375rem", { lineHeight: "1.35", fontWeight: "700" }],
            "headline-xs": ["1.125rem", { lineHeight: "1.4", fontWeight: "700" }],
            "body-md": ["1rem", { lineHeight: "1.6" }],
            "body-sm": ["0.875rem", { lineHeight: "1.55" }],
            "label-md": ["0.875rem", { lineHeight: "1.4", fontWeight: "600" }],
            "label-sm": ["0.75rem", { lineHeight: "1.4" }]
          },
          borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
          spacing: { "space-sm": "8px", "space-xs": "4px", "space-lg": "24px", "gutter": "16px", "space-md": "16px" }
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
</head>
<body class="bg-surface font-body flex flex-col min-h-screen text-[14px] sm:text-[15px]">
  <header class="sticky top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-xl pt-safe border-b border-border/60">
    <div class="max-w-3xl mx-auto h-16 px-gutter md:px-6 flex items-center justify-between gap-4">
      <a href="admin.html" class="min-h-[44px] inline-flex items-center gap-1.5 text-on-surface font-bold">
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
        <span>관리자 대시보드</span>
      </a>
      <span id="page-mode-label" class="text-headline-xs text-on-surface font-bold">새 글 작성</span>
      <a href="news.html" class="min-h-[44px] inline-flex items-center px-3 rounded-xl bg-surface-container text-body-sm font-medium text-on-surface-variant">목록</a>
    </div>
  </header>

  <main class="flex flex-col relative w-full max-w-3xl mx-auto px-gutter md:px-6 pt-6 pb-36 flex-1">
    <form id="post-form" class="rounded-2xl bg-surface-container-lowest p-6 md:p-8 shadow-sm border border-border/50 flex flex-col gap-5">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label for="post-category" class="text-label-md text-on-surface-variant">카테고리</label>
          <select id="post-category" class="w-full min-h-[48px] px-4 rounded-xl bg-surface text-on-surface text-body-md focus:outline-none focus:ring-2 focus:ring-primary/20">
            <option value="센트럴스타 소식">센트럴스타 소식</option>
            <option value="세무·법률">세무·법률</option>
            <option value="시장 동향">시장 동향</option>
            <option value="공지사항">공지사항</option>
          </select>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="post-date" class="text-label-md text-on-surface-variant">작성일</label>
          <input id="post-date" type="date" required class="w-full min-h-[48px] px-4 rounded-xl bg-surface text-on-surface text-body-md focus:outline-none focus:ring-2 focus:ring-primary/20">
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="post-title" class="text-label-md text-on-surface-variant">제목</label>
        <input id="post-title" type="text" required placeholder="게시글 제목을 입력하세요" class="w-full min-h-[48px] px-4 rounded-xl bg-surface text-on-surface text-body-md placeholder:text-muted focus:outline-none focus:ring-2 focus:ring-primary/20">
      </div>

      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between gap-2">
          <label for="post-content" class="text-label-md text-on-surface-variant">본문 (Markdown 지원)</label>
          <div class="flex gap-1.5">
            <button id="tab-edit" type="button" class="min-h-[44px] px-3 rounded-xl bg-primary text-on-primary text-label-sm font-bold">작성</button>
            <button id="tab-preview" type="button" class="min-h-[44px] px-3 rounded-xl bg-surface-container text-on-surface-variant text-label-sm font-bold">미리보기</button>
          </div>
        </div>
        <textarea id="post-content" rows="12" required placeholder="## 제목&#10;- 목록 항목&#10;**강조 텍스트** 등 마크다운 형식으로 작성하세요." class="w-full p-4 rounded-xl bg-surface text-on-surface text-body-md placeholder:text-muted focus:outline-none focus:ring-2 focus:ring-primary/20 resize-y"></textarea>
        <div id="markdown-preview" class="hidden min-h-[240px] p-4 rounded-xl bg-surface border border-border"></div>
      </div>

      <p id="write-error" class="hidden text-body-sm text-danger font-medium"></p>

      <div class="flex flex-col sm:flex-row gap-3 pt-2">
        <a href="admin.html" class="w-full sm:w-auto min-h-[48px] px-6 rounded-xl bg-surface-container text-on-surface-variant font-bold text-body-md inline-flex items-center justify-center">취소</a>
        <button id="submit-btn" type="submit" class="w-full sm:flex-1 min-h-[48px] px-6 rounded-xl bg-primary text-on-primary font-bold text-body-md shadow-sm active:scale-[0.98] transition-transform">저장하기</button>
      </div>
    </form>
  </main>

  <nav class="md:hidden fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/95 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.06)] border-t border-border/60">
    <div class="flex justify-around items-center h-20 px-space-sm">
      <a class="flex flex-col items-center justify-center gap-space-xs min-w-[56px] min-h-[56px] text-on-surface-variant transition-all" href="index.html">
        <span class="material-symbols-outlined">home</span>
        <span class="text-label-sm">홈</span>
      </a>
      <a class="flex flex-col items-center justify-center gap-space-xs min-w-[56px] min-h-[56px] text-on-surface-variant transition-all" href="news.html">
        <span class="material-symbols-outlined">newspaper</span>
        <span class="text-label-sm">부동산 소식</span>
      </a>
      <a aria-current="page" class="flex flex-col items-center justify-center gap-space-xs min-w-[56px] min-h-[56px] text-primary font-bold transition-all" href="admin.html">
        <span class="material-symbols-outlined">admin_panel_settings</span>
        <span class="text-label-sm">관리자</span>
      </a>
    </div>
  </nav>

  <script src="db.js"></script>
  <script>
    (function () {
      if (!requireAdmin()) return;

      document.addEventListener('DOMContentLoaded', async function () {
        const params = new URLSearchParams(window.location.search);
        const editId = params.get('id');

        const modeLabel = document.getElementById('page-mode-label');
        const categoryEl = document.getElementById('post-category');
        const dateEl = document.getElementById('post-date');
        const titleEl = document.getElementById('post-title');
        const contentEl = document.getElementById('post-content');
        const previewEl = document.getElementById('markdown-preview');
        const tabEdit = document.getElementById('tab-edit');
        const tabPreview = document.getElementById('tab-preview');
        const form = document.getElementById('post-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorEl = document.getElementById('write-error');

        dateEl.value = new Date().toISOString().slice(0, 10);

        if (editId) {
          modeLabel.textContent = '게시글 수정';
          document.title = '게시글 수정 | 서면포스코부동산';
          const post = await getPostById(editId);
          if (post) {
            categoryEl.value = post.category || '공지사항';
            dateEl.value = post.date || dateEl.value;
            titleEl.value = post.title || '';
            contentEl.value = post.content || '';
          }
        }

        tabEdit.addEventListener('click', function () {
          contentEl.classList.remove('hidden');
          previewEl.classList.add('hidden');
          tabEdit.classList.add('bg-primary', 'text-on-primary');
          tabEdit.classList.remove('bg-surface-container', 'text-on-surface-variant');
          tabPreview.classList.remove('bg-primary', 'text-on-primary');
          tabPreview.classList.add('bg-surface-container', 'text-on-surface-variant');
        });

        tabPreview.addEventListener('click', function () {
          previewEl.innerHTML = renderMarkdown(contentEl.value || '');
          contentEl.classList.add('hidden');
          previewEl.classList.remove('hidden');
          tabPreview.classList.add('bg-primary', 'text-on-primary');
          tabPreview.classList.remove('bg-surface-container', 'text-on-surface-variant');
          tabEdit.classList.remove('bg-primary', 'text-on-primary');
          tabEdit.classList.add('bg-surface-container', 'text-on-surface-variant');
        });

        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          errorEl.classList.add('hidden');
          submitBtn.disabled = true;
          submitBtn.textContent = 'GitHub에 저장 중...';

          try {
            const saved = await savePost({
              id: editId || null,
              category: categoryEl.value,
              date: dateEl.value,
              title: titleEl.value,
              content: contentEl.value
            });
            window.location.href = 'news-detail.html?id=' + encodeURIComponent(saved.id);
          } catch (err) {
            errorEl.textContent = err.message || '저장에 실패했습니다.';
            errorEl.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.textContent = '저장하기';
          }
        });
      });
    })();
  </script>
</body>
</html>
