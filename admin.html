<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
  <meta name="robots" content="noindex, nofollow">
  <title>관리자 페이지 | 서면포스코부동산</title>
  <style>
    @layer base {
      html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        font-family: "Toss Product Sans", "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        font-size: 14px;
      }
      body {
        overscroll-behavior: none;
        background-color: #f8f9ff;
        color: #191f28;
      }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    }
    ::-webkit-scrollbar { display: none; }
    img { max-width: 100%; object-fit: cover; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container": "#e9eefb",
            "on-surface-variant": "#414754",
            "muted": "#8b95a1",
            "secondary": "#0056c6",
            "surface": "#f2f4f6",
            "surface-container-lowest": "#ffffff",
            "weak-background": "#e8f3ff",
            "on-secondary": "#ffffff",
            "danger": "#e42939",
            "body": "#4e5968",
            "border": "#e5e8eb",
            "on-primary": "#ffffff",
            "on-surface": "#161c25",
            "primary": "#0059b9",
            "surface-container-low": "#eff4ff"
          },
          fontSize: {
            "headline-sm": ["1.375rem", { lineHeight: "1.35", fontWeight: "700" }],
            "headline-xs": ["1.125rem", { lineHeight: "1.4", fontWeight: "700" }],
            "body-md": ["1rem", { lineHeight: "1.6" }],
            "body-sm": ["0.875rem", { lineHeight: "1.55" }],
            "label-md": ["0.875rem", { lineHeight: "1.4", fontWeight: "600" }],
            "label-sm": ["0.75rem", { lineHeight: "1.4" }]
          },
          borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
          spacing: { "space-sm": "8px", "space-xs": "4px", "space-lg": "24px", "gutter": "16px", "space-md": "16px" }
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
</head>
<body class="bg-surface font-body flex flex-col min-h-screen text-[14px] sm:text-[15px]">
  <header class="sticky top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-xl pt-safe border-b border-border/60">
    <div class="max-w-5xl mx-auto h-16 px-gutter md:px-6 flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2 min-h-[44px]">
        <span class="text-headline-xs text-on-surface font-bold">서면포스코부동산</span>
      </a>
      <nav class="hidden md:flex items-center gap-6">
        <a href="index.html" class="min-h-[44px] inline-flex items-center px-2 text-body-sm font-medium text-on-surface-variant hover:text-primary">홈</a>
        <a href="news.html" class="min-h-[44px] inline-flex items-center px-2 text-body-sm font-medium text-on-surface-variant hover:text-primary">부동산 소식</a>
        <a href="admin.html" class="min-h-[44px] inline-flex items-center px-2 text-body-sm font-bold text-primary">관리자</a>
      </nav>
      <a href="index.html" class="min-h-[44px] inline-flex items-center px-3 rounded-xl bg-surface-container text-body-sm font-medium text-on-surface-variant">사이트 보기</a>
    </div>
  </header>

  <main class="flex flex-col relative w-full max-w-5xl mx-auto px-gutter md:px-6 pt-6 pb-28 md:pb-12 flex-1">
    <section id="login-view" class="hidden flex-1 flex items-center justify-center py-8">
      <div class="w-full max-w-md rounded-2xl bg-surface-container-lowest p-6 md:p-8 shadow-sm border border-border/50 flex flex-col gap-5">
        <div class="flex flex-col gap-1 text-center">
          <div class="w-12 h-12 rounded-2xl bg-weak-background text-primary flex items-center justify-center mx-auto mb-2">
            <span class="material-symbols-outlined text-[24px]">lock</span>
          </div>
          <h1 class="text-headline-sm text-on-surface font-bold">관리자 로그인</h1>
          <p class="text-body-sm text-body">게시판 관리를 위해 관리자 비밀번호를 입력해 주세요.</p>
        </div>
        <form id="admin-login-form" class="flex flex-col gap-4">
          <div class="flex flex-col gap-1.5">
            <label for="admin-password" class="text-label-md text-on-surface-variant">비밀번호</label>
            <input id="admin-password" type="password" required placeholder="비밀번호 입력" class="w-full min-h-[48px] px-4 rounded-xl bg-surface text-on-surface text-body-md placeholder:text-muted focus:outline-none focus:ring-2 focus:ring-primary/20">
          </div>
          <button type="submit" class="w-full min-h-[48px] rounded-xl bg-primary text-on-primary font-bold text-body-md shadow-sm active:scale-[0.98] transition-transform">
            로그인
          </button>
          <p id="login-error" class="hidden text-body-sm text-danger font-medium text-center"></p>
        </form>
      </div>
    </section>

    <section id="dashboard-view" class="hidden flex flex-col gap-6">
      <div class="rounded-2xl bg-surface-container-lowest p-5 md:p-6 shadow-sm border border-border/50 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div class="flex flex-col gap-1">
          <h1 class="text-headline-sm text-on-surface font-bold">게시글 관리</h1>
          <p class="text-body-sm text-body">새 글을 작성하거나 기존 게시글을 수정·삭제할 수 있습니다.</p>
        </div>
        <div class="flex flex-wrap items-center gap-2.5">
          <a href="news-write.html" class="min-h-[44px] px-5 rounded-xl bg-primary text-on-primary font-bold text-body-sm inline-flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition-transform">
            <span class="material-symbols-outlined text-[18px]">add</span>
            새 글 작성
          </a>
          <button id="logout-btn" type="button" class="min-h-[44px] px-4 rounded-xl bg-surface-container text-on-surface-variant font-bold text-body-sm inline-flex items-center justify-center gap-1.5 hover:bg-danger hover:text-on-primary transition-colors">
            <span class="material-symbols-outlined text-[18px]">logout</span>
            로그아웃
          </button>
        </div>
      </div>

      <p id="dashboard-error" class="hidden text-body-sm text-danger font-medium"></p>

      <div class="rounded-2xl bg-surface-container-lowest shadow-sm border border-border/50 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-surface-container-low border-b border-border text-label-sm text-on-surface-variant">
                <th class="py-3.5 px-4 font-bold whitespace-nowrap">번호</th>
                <th class="py-3.5 px-4 font-bold whitespace-nowrap">카테고리</th>
                <th class="py-3.5 px-4 font-bold min-w-[200px]">제목</th>
                <th class="py-3.5 px-4 font-bold whitespace-nowrap">작성일</th>
                <th class="py-3.5 px-4 font-bold text-right whitespace-nowrap">관리</th>
              </tr>
            </thead>
            <tbody id="admin-post-tbody" class="divide-y divide-border text-body-sm"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <nav class="md:hidden fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/95 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.06)] border-t border-border/60">
    <div class="flex justify-around items-center h-20 px-space-sm">
      <a class="flex flex-col items-center justify-center gap-space-xs min-w-[56px] min-h-[56px] text-on-surface-variant transition-all" href="index.html">
        <span class="material-symbols-outlined">home</span>
        <span class="text-label-sm">홈</span>
      </a>
      <a class="flex flex-col items-center justify-center gap-space-xs min-w-[56px] min-h-[56px] text-on-surface-variant transition-all" href="news.html">
        <span class="material-symbols-outlined">newspaper</span>
        <span class="text-label-sm">부동산 소식</span>
      </a>
      <a aria-current="page" class="flex flex-col items-center justify-center gap-space-xs min-w-[56px] min-h-[56px] text-primary font-bold transition-all" href="admin.html">
        <span class="material-symbols-outlined">admin_panel_settings</span>
        <span class="text-label-sm">관리자</span>
      </a>
    </div>
  </nav>

  <script src="db.js"></script>
  <script>
    (function () {
      const loginView = document.getElementById('login-view');
      const dashboardView = document.getElementById('dashboard-view');
      const loginForm = document.getElementById('admin-login-form');
      const passwordInput = document.getElementById('admin-password');
      const loginError = document.getElementById('login-error');
      const logoutBtn = document.getElementById('logout-btn');
      const tbody = document.getElementById('admin-post-tbody');
      const dashboardError = document.getElementById('dashboard-error');

      async function renderDashboardTable() {
        const posts = await getPosts();
        if (!posts || posts.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="py-10 px-4 text-center text-body-sm text-muted">작성된 게시글이 없습니다.</td></tr>';
          return;
        }

        tbody.innerHTML = posts.map(function (post, index) {
          return (
            '<tr class="hover:bg-surface/60 transition-colors">' +
              '<td class="py-3.5 px-4 text-muted font-medium whitespace-nowrap">' + (posts.length - index) + '</td>' +
              '<td class="py-3.5 px-4 whitespace-nowrap"><span class="px-2.5 py-0.5 rounded-full bg-weak-background text-primary text-label-sm font-bold">' + escapeHtml(post.category || '공지사항') + '</span></td>' +
              '<td class="py-3.5 px-4 font-bold text-on-surface"><a href="news-detail.html?id=' + encodeURIComponent(post.id) + '" class="hover:text-primary transition-colors">' + escapeHtml(post.title || '') + '</a></td>' +
              '<td class="py-3.5 px-4 text-muted whitespace-nowrap">' + escapeHtml(post.date || '') + '</td>' +
              '<td class="py-3.5 px-4 text-right whitespace-nowrap">' +
                '<div class="inline-flex items-center gap-2">' +
                  '<a href="news-write.html?id=' + encodeURIComponent(post.id) + '" class="min-h-[44px] px-3.5 rounded-xl bg-surface-container text-on-surface text-label-sm font-bold inline-flex items-center justify-center hover:bg-primary hover:text-on-primary transition-colors">수정</a>' +
                  '<button type="button" data-delete-id="' + escapeHtml(post.id) + '" class="min-h-[44px] px-3.5 rounded-xl bg-danger/10 text-danger text-label-sm font-bold inline-flex items-center justify-center hover:bg-danger hover:text-on-primary transition-colors">삭제</button>' +
                '</div>' +
              '</td>' +
            '</tr>'
          );
        }).join('');

        tbody.querySelectorAll('button[data-delete-id]').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            const id = btn.getAttribute('data-delete-id');
            if (!window.confirm('선택한 게시글을 삭제하시겠습니까?')) return;
            dashboardError.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = '삭제 중...';
            try {
              await deletePost(id);
              await renderDashboardTable();
            } catch (err) {
              dashboardError.textContent = err.message || '삭제에 실패했습니다.';
              dashboardError.classList.remove('hidden');
              btn.disabled = false;
              btn.textContent = '삭제';
            }
          });
        });
      }

      document.addEventListener('DOMContentLoaded', async function () {
        if (!isAdmin()) {
          loginView.classList.remove('hidden');
          dashboardView.classList.add('hidden');
          loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            loginError.classList.add('hidden');
            const cfg = await loadConfig();
            if (passwordInput.value === cfg.admin_password) {
              sessionStorage.setItem('isAdmin', 'true');
              window.location.reload();
            } else {
              loginError.textContent = '비밀번호가 올바르지 않습니다.';
              loginError.classList.remove('hidden');
            }
          });
        } else {
          loginView.classList.add('hidden');
          dashboardView.classList.remove('hidden');
          logoutBtn.addEventListener('click', function () {
            sessionStorage.clear();
            window.location.reload();
          });
          await renderDashboardTable();
        }
      });
    })();
  </script>
</body>
</html>
